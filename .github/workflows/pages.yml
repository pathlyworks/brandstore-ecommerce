name: Deploy preview (GitHub Pages)

# The React app (web/) as a public preview: https://pathlyworks.github.io/brandstore-ecommerce/
# GitHub Pages has no backend, so this build answers the TechSphere API in the browser with the same MSW
# handlers the tests use (VITE_DEMO_API=1, src/demo/installDemoApi.ts). web/scripts/pages-routes.mjs writes the app
# shell at every public route (200, Task 7) and as 404.html for the rest, so deep links load the app. The web-vitals library logs LCP, INP and CLS in the console there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build the preview
        run: npm run build -w web
        env:
          VITE_BASE: /brandstore-ecommerce/
          VITE_DEMO_API: '1'
          VITE_API_BASE: https://techsphere-api.demo.invalid
          VITE_RELEASE: ${{ github.sha }}
      - name: App shell at every public route (200 instead of 404 on deep links) and 404.html
        run: node web/scripts/pages-routes.mjs web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
