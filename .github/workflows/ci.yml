name: CI

# Runs on every pull request and on pushes to main. Quality gates (Task 6): type-check, lint, every unit and
# component test with coverage floors (React app: 75% of lines on web/src/state and web/src/components;
# legacy site: 80% on src/state and src/utils), the end-to-end tests against the
# official TechSphere API (legacy pages and the React app in web/), a cross-browser smoke test
# (Firefox and WebKit), Lighthouse, and the React app's own checks (ESLint with typescript-eslint and
# react-hooks, the brand-token check, tsc, Vitest with RTL/MSW/axe, the Vite build and the Storybook build).
# Each job starts from a clean checkout.
#
# Task 7 (production readiness): every pull request also gets a deploy preview (the "Deploy preview" job
# builds the production bundle and publishes it as the `deploy-preview` artifact; main is deployed to GitHub
# Pages by pages.yml), and a version tag (v*) runs every gate again and, only when all of them pass, publishes
# the GitHub Release (the "Release" job). Builds carry VITE_RELEASE, the name error reports are tagged with.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

env:
  VITE_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Branch name follows CONTRIBUTING.md (not for release tags)
        if: github.ref_type != 'tag'
        run: node scripts/check-branch.mjs "${{ github.head_ref || github.ref_name }}"
      - run: npm run lint
      - run: npm run format:check
      - name: Show what Prettier would change (only when the format check failed)
        if: failure()
        run: npx prettier --write . > /dev/null && git --no-pager diff
      - name: TypeScript domain types match the captured API responses
        run: |
          node scripts/gen-observed-types-check.mjs
          git diff --exit-code src/types/__checks__/observed.ts
          npm run typecheck
      - run: npm run build
      - run: npm run contract

  web:
    name: React app (web/) — lint, types, tests, build, Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: ESLint (no any, hooks deps, stable keys) and brand tokens only
        run: npm run lint -w web
      - name: TypeScript strict (noImplicitAny)
        if: success() || failure() # report every check, not only the first that fails
        run: npm run typecheck -w web
      - name: Vitest (components, hooks, routes, routing map vs plan, axe on every story)
        if: success() || failure() # report every check, not only the first that fails
        run: npm run test -w web
      - name: Vite build
        if: success() || failure() # report every check, not only the first that fails
        run: npm run build -w web
      - name: npm run dev passes its options to Vite (as the grader starts the app)
        if: success() || failure()
        run: |
          npm run dev -- --port 4999 --strictPort --host 0.0.0.0 > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4999/ | grep -q '<div id="root">'; then echo "dev server up on 4999"; kill %1; exit 0; fi
            sleep 1
          done
          cat dev.log; exit 1
      - name: The admin chunk never ships to shoppers
        if: success() || failure()
        run: npm run check:bundles -w web
      - name: npm audit (policy in task_4_security.md §8)
        if: success() || failure()
        run: npm run audit
      - name: Storybook build
        if: success() || failure() # report every check, not only the first that fails
        run: npm run build-storybook -w web
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: storybook
          path: web/storybook-static/
          retention-days: 14

  test:
    name: Unit and integration tests (Vitest, jsdom, MSW) with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5 # the TechSphere API integration tests start server.py
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: npm test (both apps, unit + component + integration) with coverage floors (fails below them)
        run: npm run test:coverage
      - name: Types still match a freshly captured TechSphere API (contract drift)
        run: |
          npm run api:capture
          npm run api:fields
          npm run typecheck
      - name: Coverage of src/state and src/utils (also in the job summary)
        if: always()
        run: node scripts/coverage-summary.mjs coverage/coverage-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5 # the TechSphere API (api/techsphere/server.py)
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: npm run e2e (Playwright Test specs, Chromium; legacy pages and web/)
        run: npm run e2e
      - name: Older journey suite (desktop and phone)
        run: npm run e2e:journeys
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  cross-browser:
    name: Cross-browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Playwright Test specs in ${{ matrix.browser }}
        run: npm run e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    name: Lighthouse (built site against the TechSphere API)
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Start the API and the built site
        run: |
          python3 api/techsphere/server.py 4010 &
          node scripts/serve.mjs dist 4173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4010/categories >/dev/null && curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - name: Lighthouse on the home, catalog, product and cart pages (mobile and desktop)
        run: node scripts/lighthouse.mjs http://127.0.0.1:4173 lighthouse
      - name: Lighthouse CI budgets, legacy site (lighthouserc.legacy.json)
        run: npx lhci autorun --config=lighthouserc.legacy.json
      - name: Serve the React app (web/dist, built above with VITE_API_BASE)
        run: |
          npm run preview -w web -- --host 127.0.0.1 --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
      - name: Lighthouse CI budgets, React app (lighthouserc.json; fails the job when a budget is missed)
        run: npx lhci autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: lighthouse/
          retention-days: 30

  preview:
    name: Deploy preview (production build of the React app)
    if: github.event_name == 'pull_request'
    needs: [lint, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build exactly what GitHub Pages serves, for this pull request
        run: npm run build -w web
        env:
          VITE_BASE: /
          VITE_DEMO_API: '1'
          VITE_API_BASE: https://techsphere-api.demo.invalid
      - run: node web/scripts/pages-routes.mjs web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-preview
          path: web/dist
          retention-days: 14
      - name: How to open the preview
        run: |
          {
            echo "### Deploy preview"
            echo "Download the **deploy-preview** artifact of this run, then: \`npx serve -s dist\` and open http://localhost:3000."
            echo "It is the same build GitHub Pages serves after merge (API answered in the browser, VITE_DEMO_API=1)."
            echo "Release name in error reports: \`$VITE_RELEASE\`."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release (only on a v* tag, after every gate passed)
    if: github.ref_type == 'tag'
    needs: [lint, web, test, e2e, cross-browser, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build the React app for the release
        run: npm run build -w web
      - name: Publish the GitHub Release with the build attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd web/dist && zip -qr "../../brandstore-web-${GITHUB_REF_NAME}.zip" .)
          notes=$(awk -v tag="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"tag {on=1; next} on && /^## / {exit} on' CHANGELOG.md)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "brandstore-web-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "brandstore-web-${GITHUB_REF_NAME}.zip" \
              --title "BrandStore $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}" --verify-tag
          fi
