name: CI

# Runs on every pull request and on pushes to main: lint, unit + integration tests (with coverage
# of src/state and src/utils, which must stay at 80% or more), the end-to-end tests against the
# official TechSphere API (legacy pages and the React app in web/), a cross-browser smoke test
# (Firefox and WebKit), Lighthouse, and the React app's own checks (ESLint with typescript-eslint and
# react-hooks, the brand-token check, tsc, Vitest with RTL/MSW/axe, the Vite build and the Storybook build).
# Each job starts from a clean checkout.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Branch name follows CONTRIBUTING.md
        run: node scripts/check-branch.mjs "${{ github.head_ref || github.ref_name }}"
      - run: npm run lint
      - run: npm run format:check
      - name: TypeScript domain types match the captured API responses
        run: |
          node scripts/gen-observed-types-check.mjs
          git diff --exit-code src/types/__checks__/observed.ts
          npm run typecheck
      - run: npm run build
      - run: npm run contract

  web:
    name: React app (web/) — lint, types, tests, build, Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: ESLint (no any, hooks deps, stable keys) and brand tokens only
        run: npm run lint -w web
      - name: TypeScript strict (noImplicitAny)
        if: success() || failure() # report every check, not only the first that fails
        run: npm run typecheck -w web
      - name: Vitest (components, hooks, routes, routing map vs plan, axe on every story)
        if: success() || failure() # report every check, not only the first that fails
        run: npm run test -w web
      - name: Vite build
        if: success() || failure() # report every check, not only the first that fails
        run: npm run build -w web
      - name: Storybook build
        if: success() || failure() # report every check, not only the first that fails
        run: npm run build-storybook -w web
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: storybook
          path: web/storybook-static/
          retention-days: 14

  test:
    name: Unit and integration tests (Vitest, jsdom, MSW) with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5 # the TechSphere API integration tests start server.py
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: npm test (unit + integration) with coverage thresholds
        run: npm run test:coverage
      - name: Types still match a freshly captured TechSphere API (contract drift)
        run: |
          npm run api:capture
          npm run api:fields
          npm run typecheck
      - name: Coverage of src/state and src/utils (also in the job summary)
        if: always()
        run: node scripts/coverage-summary.mjs coverage/coverage-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5 # the TechSphere API (api/techsphere/server.py)
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: npm run e2e (Playwright Test specs, Chromium; legacy pages and web/)
        run: npm run e2e
      - name: Older journey suite (desktop and phone)
        run: npm run e2e:journeys
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  cross-browser:
    name: Cross-browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Playwright Test specs in ${{ matrix.browser }}
        run: npm run e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    name: Lighthouse (built site against the TechSphere API)
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Start the API and the built site
        run: |
          python3 api/techsphere/server.py 4010 &
          node scripts/serve.mjs dist 4173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4010/categories >/dev/null && curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - name: Lighthouse on the home, catalog, product and cart pages (mobile and desktop)
        run: node scripts/lighthouse.mjs http://127.0.0.1:4173 lighthouse
      - name: Lighthouse CI budgets (lighthouserc.json)
        run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: lighthouse/
          retention-days: 30
