name: CI

# Runs on every pull request and on pushes to main: lint, unit + integration tests (with coverage
# of src/state and src/utils, which must stay at 80% or more), then the end-to-end tests against
# the official TechSphere API. Each job starts from a clean checkout.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Branch name follows CONTRIBUTING.md
        run: node scripts/check-branch.mjs "${{ github.head_ref || github.ref_name }}"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run contract

  test:
    name: Unit and integration tests (Vitest, jsdom, MSW) with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5 # the TechSphere API integration tests start server.py
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: npm test (unit + integration) with coverage thresholds
        run: npm run test:coverage
      - name: Coverage of src/state and src/utils (also in the job summary)
        if: always()
        run: node scripts/coverage-summary.mjs coverage/coverage-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5 # the TechSphere API (api/techsphere/server.py)
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: npm run e2e (the two Playwright Test specs)
        run: npm run e2e
      - name: Older journey suite (desktop and phone)
        run: npm run e2e:journeys
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
