# Netlify settings. The site is plain HTML, CSS and ES modules. `npm run build` copies the
# deployable files into dist/ and checks every page reference and module import (scripts/build.mjs).
# GitHub Pages ignores this file; deploy dist/ there (see docs/RUNBOOK.md).
[build]
  command = "npm run build"
  publish = "dist"

# Security headers for every response. The Content-Security-Policy only allows
# files from the site itself, which is all this project uses (no inline scripts,
# no inline styles, no third-party requests). connect-src 'self' allows the API on /api (the Netlify
# function). If the site is pointed at an API on another origin (VITE_API_BASE), add that origin to
# connect-src, e.g. connect-src 'self' https://api.techsphere.example (see docs/SECURITY.md).
# qa/headers.js tests the site under exactly these headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
