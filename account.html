<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your BrandStore orders and saved addresses. Sign in required.">
    <title>Your account — BrandStore</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BrandStore">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="Your account — BrandStore">
    <meta property="og:description" content="Your BrandStore orders and saved addresses. Sign in required.">
    <meta property="og:url" content="https://brandstore.example/account.html">
    <meta property="og:image" content="https://brandstore.example/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="BrandStore: curated electronics, apparel and modern essentials, with a headphones, smartwatch and backpack illustration.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Your account — BrandStore">
    <meta name="twitter:description" content="Your BrandStore orders and saved addresses. Sign in required.">
    <meta name="twitter:image" content="https://brandstore.example/og-image.png">
    <!-- Cascade order: tokens/reset -> page skeleton -> BEM components -> utilities -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <script type="module" src="src/pages/account.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
        <div class="container site-header__inner">
            <a href="index.html" class="logo">BrandStore</a>
            <nav class="nav" aria-label="Main Navigation">
                <button type="button" class="nav__toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">
                    <span class="nav__toggle-icon" aria-hidden="true"></span>
                </button>
                <ul id="nav-menu" class="nav__list">
                    <li class="nav__item"><a href="index.html" class="nav__link">Home</a></li>
                    <li class="nav__item"><a href="catalog.html" class="nav__link">Shop</a></li>
                    <li class="nav__item"><a href="index.html#categories" class="nav__link">Categories</a></li>
                    <li class="nav__item"><a href="index.html#deals" class="nav__link">Deals</a></li>
                    <li class="nav__item"><a href="comparison.html" class="nav__link">Compare Products</a></li>
                    <li class="nav__item"><a href="cart.html" class="nav__link" data-cart-link>Cart (0)</a></li>
                    <li class="nav__item"><a href="login.html" class="nav__link" data-account-link>Sign in</a></li>
                </ul>
            </nav>
        </div>
    </header>

                <main id="main-content" tabindex="-1" class="section section--compact">
        <div class="container">
            <section class="page-header" aria-labelledby="account-title">
                <h1 id="account-title" class="page-header__title">Your account</h1>
                <p id="account-greeting" class="page-header__lead"></p>
                <button type="button" id="sign-out" class="btn btn--ghost">Sign out</button>
            </section>
            <p id="account-message" class="cart__message" role="status"></p>

            <section class="account__section" aria-labelledby="orders-title">
                <h2 id="orders-title" class="catalog__heading">Your orders</h2>
                <ul id="orders-list" class="cart__list" aria-busy="true"></ul>
                <nav id="orders-pagination" class="pagination" aria-label="Order pages" hidden></nav>
            </section>

            <section class="account__section" aria-labelledby="addresses-title">
                <h2 id="addresses-title" class="catalog__heading">Saved addresses</h2>
                <ul id="addresses-list" class="cart__list"></ul>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container site-footer__inner">
            <p>&copy; 2026 BrandStore. All rights reserved.</p>
            <nav class="footer-nav" aria-label="Footer Navigation">
                <ul class="footer-nav__list">
                    <li class="footer-nav__item"><a href="index.html" class="footer-nav__link">Home</a></li>
                    <li class="footer-nav__item"><a href="catalog.html" class="footer-nav__link">Shop All Products</a></li>
                    <li class="footer-nav__item"><a href="index.html#newsletter" class="footer-nav__link">Newsletter</a></li>
                </ul>
            </nav>
        </div>
    </footer>

</body>
</html>
